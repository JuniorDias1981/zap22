<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Zap22 • Validador de Pedidos</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; padding: 20px; color: #333; }
    .box { max-width: 400px; margin: 40px auto; background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { margin-top: 0; color: #128c7e; text-align: center; }
    label { display: block; margin-top: 15px; font-weight: bold; font-size: 14px; color: #555; }
    input, select, button { width: 100%; padding: 12px; margin-top: 5px; border: 2px solid #ddd; border-radius: 8px; font-size: 16px; box-sizing: border-box; outline: none; }
    input:focus, select:focus { border-color: #25d366; }
    button { background: #25d366; color: #fff; font-weight: bold; border: none; margin-top: 20px; cursor: pointer; transition: 0.2s; }
    button:hover { background: #128c7e; }
    #resultado { margin-top: 20px; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; display: none; }
    .sucesso { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .erro { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; }
  </style>
</head>
<body>

  <div class="box">
    <h2>Validador Zap22 🔐</h2>
    <p style="font-size: 13px; color: #777; text-align: center;">Use esta ferramenta para verificar se o valor do pedido enviado pelo cliente foi alterado.</p>
    
    <form id="formValidador">
      <label for="lojaSlug">Identificador da Loja (Slug):</label>
      <input type="text" id="lojaSlug" placeholder="ex: reidapipoca ou micentercell" required />

      <label for="valorPedido">Valor Total Recebido (R$):</label>
      <input type="number" id="valorPedido" step="0.01" placeholder="ex: 45.50" required />

      <label for="tokenCliente">Chave de Segurança (#):</label>
      <input type="text" id="tokenCliente" placeholder="ex: A94F2D" maxlength="6" style="text-transform: uppercase;" required />

      <button type="submit">Verificar Autenticidade</button>
    </form>

    <div id="resultado"></div>
  </div>

  <script>
    const gerarTokenSeguranca = (valorTotal, lojaSlug) => {
      const slugLimpo = String(lojaSlug).trim().toLowerCase();
      const valorTexto = valorTotal.toFixed(2);
      
      const stringBase = `${valorTexto}-${slugLimpo}-zap22@seguro`;
      
      let hash = 0;
      for (let i = 0; i < stringBase.length; i++) {
        hash = (hash << 5) - hash + stringBase.charCodeAt(i);
        hash |= 0;
      }
      return Math.abs(hash).toString(16).substring(0, 6).toUpperCase();
    };

    document.getElementById("formValidador").addEventListener("submit", (e) => {
      e.preventDefault();
      
      const slugDigitado = document.getElementById("lojaSlug").value;
      const valor = parseFloat(document.getElementById("valorPedido").value);
      const tokenDigitado = document.getElementById("tokenCliente").value;
      const divResultado = document.getElementById("resultado");

      // Gera o token esperado
      const tokenCalculado = gerarTokenSeguranca(valor, slugDigitado);

      // Log de depuração para conferência no console (F12)
      console.log("String Base Gerada no Validador:", `${valor.toFixed(2)}-${slugDigitado.trim().toLowerCase()}-zap22@seguro`);
      console.log("Token Calculated:", tokenCalculado, " | Token Typed:", tokenDigitado.trim().toUpperCase());

      divResultado.style.display = "block";

      if (tokenDigitado.trim().toUpperCase() === tokenCalculado) {
        divResultado.className = "sucesso";
        divResultado.innerHTML = "✅ PEDIDO AUTÊNTICO!<br><span style='font-size:12px; font-weight:normal;'>O valor bate com o sistema do Zap22.</span>";
      } else {
        divResultado.className = "erro";
        divResultado.innerHTML = "❌ ALERTA: DADOS INCORRETOS OU FRAUDE!<br><span style='font-size:12px; font-weight:normal;'>A chave não bate com o valor e slug fornecidos. Verifique se o slug está correto.</span>";
      }
    });
  </script>
</body>
</html>
